<!doctype html><html lang="bn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>K-Σ Orders</title><style>body{font-family:Arial;background:#f5f6f8;padding:20px}table{width:100%;background:white;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}@media(max-width:700px){table{font-size:12px}}</style><h1>K-Σ Order Dashboard</h1><p id="c"></p><table><thead><tr><th>ID</th><th>নাম</th><th>ফোন</th><th>ঠিকানা</th><th>সময়</th></tr></thead><tbody id="r"></tbody></table><script>let k=new URLSearchParams(location.search).get("key");fetch("/api/orders?key="+encodeURIComponent(k)).then(x=>x.json()).then(d=>{c.textContent="মোট অর্ডার: "+d.count;r.innerHTML=(d.orders||[]).map(o=>"<tr><td>"+o.id+"</td><td>"+o.name+"</td><td>"+o.phone+"</td><td>"+o.address+"</td><td>"+new Date(o.created_at).toLocaleString("bn-BD")+"</td></tr>").join("")})</script></html>
